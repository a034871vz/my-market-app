spring:
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:marketdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:marketdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  liquibase:
    default-schema: public
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:marketdb}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      client:
        registration:
          payment-service:
            provider: keycloak
            client-id: market-service
            client-secret: ${KEYCLOAK_CLIENT_SECRET:default-secret}
            authorization-grant-type: client_credentials
            scope: payment
        provider:
          keycloak:
#            issuer-uri: http://${KEYCLOAK_HOST:localhost}:8082/realms/market-realm
            token-uri: http://${KEYCLOAK_HOST:localhost}:8082/realms/market-realm/protocol/openid-connect/token

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081}