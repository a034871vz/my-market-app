spring:
  application:
    name: my-market-app

  profiles:
    active: dev

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml

  thymeleaf:
    cache: false

  logging:
    level:
      liquibase: DEBUG
      org.springframework.r2dbc: DEBUG
      io.r2dbc.postgresql.QUERY: DEBUG
      io.r2dbc.h2: DEBUG

server:
  port: 8080