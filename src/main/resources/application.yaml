spring:
  application:
    name: my-market-app

  profiles:
    active: dev

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  logging:
    level:
      liquibase: DEBUG
      org.springframework.jdbc: DEBUG

server:
  port: 8080